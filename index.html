<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chemie-Tutor · Zwischenmolekulare Kräfte</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #171b26;
    --surface2: #1e2335;
    --border: #2a3050;
    --accent: #5b9cf6;
    --accent2: #7fcfa2;
    --accent3: #f0a96e;
    --text: #e8ecf4;
    --text-muted: #7a88a8;
    --user-bubble: #1e3a5c;
    --bot-bubble: #1a2238;
    --dot1: #5b9cf6;
    --dot2: #7fcfa2;
    --dot3: #c084fc;
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Nunito’, sans-serif;
background: var(–bg);
color: var(–text);
height: 100vh;
display: flex;
flex-direction: column;
overflow: hidden;
}

/* Animated background */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background:
radial-gradient(ellipse 60% 50% at 20% 10%, rgba(91,156,246,0.07) 0%, transparent 60%),
radial-gradient(ellipse 40% 40% at 80% 80%, rgba(127,207,162,0.06) 0%, transparent 55%),
radial-gradient(ellipse 50% 30% at 60% 20%, rgba(192,132,252,0.05) 0%, transparent 50%);
pointer-events: none;
z-index: 0;
}

/* Header */
header {
position: relative;
z-index: 10;
padding: 14px 24px;
background: rgba(15,17,23,0.85);
backdrop-filter: blur(12px);
border-bottom: 1px solid var(–border);
display: flex;
align-items: center;
gap: 14px;
flex-shrink: 0;
}

.logo-orb {
width: 40px;
height: 40px;
border-radius: 12px;
background: linear-gradient(135deg, #5b9cf6, #7fcfa2);
display: flex;
align-items: center;
justify-content: center;
font-size: 18px;
flex-shrink: 0;
box-shadow: 0 0 20px rgba(91,156,246,0.3);
}

.header-text h1 {
font-family: ‘Instrument Serif’, serif;
font-size: 1.15rem;
color: var(–text);
letter-spacing: 0.01em;
}

.header-text p {
font-size: 0.72rem;
color: var(–text-muted);
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.05em;
}

.header-badge {
margin-left: auto;
font-size: 0.68rem;
font-family: ‘DM Mono’, monospace;
color: var(–accent2);
background: rgba(127,207,162,0.1);
border: 1px solid rgba(127,207,162,0.25);
padding: 4px 10px;
border-radius: 20px;
letter-spacing: 0.04em;
}

/* Chat area */
#chat {
flex: 1;
overflow-y: auto;
padding: 24px 16px 8px;
display: flex;
flex-direction: column;
gap: 16px;
position: relative;
z-index: 1;
scroll-behavior: smooth;
}

#chat::-webkit-scrollbar { width: 4px; }
#chat::-webkit-scrollbar-track { background: transparent; }
#chat::-webkit-scrollbar-thumb { background: var(–border); border-radius: 4px; }

.message-row {
display: flex;
gap: 10px;
align-items: flex-end;
animation: fadeSlideIn 0.35s ease forwards;
opacity: 0;
}

@keyframes fadeSlideIn {
from { opacity: 0; transform: translateY(10px); }
to   { opacity: 1; transform: translateY(0); }
}

.message-row.user { flex-direction: row-reverse; }

.avatar {
width: 30px;
height: 30px;
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
font-size: 14px;
flex-shrink: 0;
margin-bottom: 2px;
}

.avatar.bot {
background: linear-gradient(135deg, #5b9cf6, #7fcfa2);
box-shadow: 0 0 12px rgba(91,156,246,0.25);
}

.avatar.user {
background: linear-gradient(135deg, #f0a96e, #e87a9e);
}

.bubble {
max-width: min(72%, 560px);
padding: 12px 16px;
border-radius: 16px;
font-size: 0.92rem;
line-height: 1.65;
position: relative;
}

.bubble.bot {
background: var(–bot-bubble);
border: 1px solid var(–border);
border-bottom-left-radius: 4px;
color: var(–text);
}

.bubble.user {
background: var(–user-bubble);
border: 1px solid rgba(91,156,246,0.2);
border-bottom-right-radius: 4px;
color: var(–text);
}

.bubble strong { color: var(–accent); font-weight: 600; }
.bubble em { color: var(–accent2); font-style: italic; }

/* Typing indicator */
.typing-row {
display: flex;
gap: 10px;
align-items: flex-end;
animation: fadeSlideIn 0.3s ease forwards;
opacity: 0;
}

.typing-bubble {
background: var(–bot-bubble);
border: 1px solid var(–border);
border-bottom-left-radius: 4px;
padding: 14px 18px;
border-radius: 16px;
display: flex;
gap: 5px;
align-items: center;
}

.typing-dot {
width: 7px;
height: 7px;
border-radius: 50%;
animation: bounce 1.3s infinite;
}

.typing-dot:nth-child(1) { background: var(–dot1); animation-delay: 0s; }
.typing-dot:nth-child(2) { background: var(–dot2); animation-delay: 0.18s; }
.typing-dot:nth-child(3) { background: var(–dot3); animation-delay: 0.36s; }

@keyframes bounce {
0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
30% { transform: translateY(-5px); opacity: 1; }
}

/* Input area */
.input-area {
position: relative;
z-index: 10;
padding: 14px 16px 16px;
background: rgba(15,17,23,0.9);
backdrop-filter: blur(12px);
border-top: 1px solid var(–border);
flex-shrink: 0;
}

.input-wrapper {
display: flex;
gap: 10px;
align-items: flex-end;
max-width: 720px;
margin: 0 auto;
background: var(–surface2);
border: 1px solid var(–border);
border-radius: 16px;
padding: 8px 8px 8px 16px;
transition: border-color 0.2s;
}

.input-wrapper:focus-within {
border-color: rgba(91,156,246,0.5);
box-shadow: 0 0 0 3px rgba(91,156,246,0.08);
}

#userInput {
flex: 1;
background: none;
border: none;
outline: none;
color: var(–text);
font-family: ‘Nunito’, sans-serif;
font-size: 0.92rem;
line-height: 1.5;
resize: none;
max-height: 120px;
min-height: 24px;
padding: 4px 0;
}

#userInput::placeholder { color: var(–text-muted); }

#sendBtn {
width: 38px;
height: 38px;
border-radius: 10px;
background: linear-gradient(135deg, #5b9cf6, #7fcfa2);
border: none;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: transform 0.15s, opacity 0.15s;
box-shadow: 0 2px 12px rgba(91,156,246,0.3);
}

#sendBtn:hover { transform: scale(1.06); }
#sendBtn:active { transform: scale(0.96); }
#sendBtn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

#sendBtn svg { width: 16px; height: 16px; fill: #fff; }

.input-hint {
text-align: center;
font-size: 0.68rem;
color: var(–text-muted);
margin-top: 8px;
font-family: ‘DM Mono’, monospace;
letter-spacing: 0.03em;
}

/* Molecule decoration */
.molecule-bg {
position: fixed;
bottom: 100px;
right: -30px;
opacity: 0.04;
font-size: 160px;
pointer-events: none;
z-index: 0;
transform: rotate(-15deg);
}

/* Formatting helpers */
.bubble p + p { margin-top: 8px; }
.bubble ul { padding-left: 18px; margin-top: 6px; }
.bubble ul li { margin-bottom: 4px; }
</style>

</head>
<body>

<div class="molecule-bg">⚗️</div>

<header>
  <div class="logo-orb">🧪</div>
  <div class="header-text">
    <h1>Chemie-Tutor</h1>
    <p>Zwischenmolekulare Kräfte · 10. Klasse</p>
  </div>
  <div class="header-badge">KI-Tutor aktiv</div>
</header>

<div id="chat"></div>

<div class="input-area">
  <div class="input-wrapper">
    <textarea id="userInput" rows="1" placeholder="Deine Antwort eingeben …"></textarea>
    <button id="sendBtn" title="Senden">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
  <div class="input-hint">Enter zum Senden · Shift+Enter für neue Zeile</div>
</div>

<script>
const SYSTEM_PROMPT = `Du bist eine freundliche und geduldige Lehrperson in der Rolle eines Tutors. Du unterstützt Schülerinnen und Schüler der 10. Schulstufe (Gymnasium) beim Lernen über zwischenmolekulare Kräfte (Wasserstoffbrücken, Van-der-Waals-Wechselwirkungen und Dipol-Dipol-Wechselwirkungen), angewandt auf organische Substanzen. Das Thema umfasst auch den Einfluss auf Siedetemperaturen, Viskosität, Dichte, Mischbarkeit etc.

Dein Ziel ist es, durch Fragen, Rückmeldungen und Reflexion das Verständnis zu fördern. Du bleibst konsequent in dieser Tutorrolle.

Pädagogische Grundsätze:
- Du erklärst nur so viel wie nötig.
- Du förderst eigenständiges Denken.
- Du gibst keine vollständigen Musterlösungen.
- Du übernimmst keine Aufgaben der Lernenden.

Sprache und Stil:
- Antworte IMMER auf Deutsch.
- Verwende eine klare, einfache und sachliche Sprache.
- Schreibe altersgerecht für Schülerinnen und Schüler der 10. Klasse.
- Strukturiere Antworten übersichtlich.

Gesprächsbeginn:
Bitte die Lernenden zuerst um:
1. den Titel ihres Themas
2. eine kurze Beschreibung, was sie darüber erklären oder zusammenfassen möchten.
Gib keine Beispiele oder Inhalte vor. Warte auf die Antwort, bevor du fortfährst.

Arbeitsweise im Gespräch:
Arbeite schrittweise:
1. Stelle jeweils nur EINE Frage gleichzeitig.
2. Warte auf die Antwort der Lernenden.
3. Stelle anschließend eine neue Frage oder gib eine kurze Rückmeldung.

Deine Fragen sollen:
- das Verständnis prüfen
- zum Nachdenken anregen
- Unklarheiten sichtbar machen
- zum präziseren Formulieren führen

Wenn Aussagen unklar oder falsch sind:
- weise freundlich darauf hin
- stelle eine klärende Frage
- korrigiere nicht sofort vollständig

Umgang mit Antworten:
Analysiere jede Antwort der Lernenden und achte auf:
- fachliche Richtigkeit
- Verständlichkeit
- Vollständigkeit
- Struktur
Wenn etwas fehlt oder unklar ist, stelle gezielte Rückfragen.

Textphase:
Wenn genügend Verständnis vorhanden ist, bitte die Lernenden, ihr Thema ausführlich und strukturiert zu erklären oder einen Textentwurf zu schreiben. Du überarbeitest den Text nicht selbst.

Feedbackphase:
Wenn die Lernenden keine weiteren Fragen beantworten möchten, gib ein zusammenfassendes Feedback.
Das Feedback enthält:
1. Stärken des Textes
2. mögliche inhaltliche Lücken
3. Einschätzung der Verständlichkeit
4. Einschätzung der Struktur

Wichtig:
- Du ergänzt keine neuen Inhalte.
- Du formulierst keine konkrete Musterlösung.
- Du gibst keine direkten Verbesserungsvorschläge.
Beende dein Feedback mit der offenen Frage: „Wie möchtest du mit dieser Rückmeldung weiterarbeiten?"`;

const chatEl = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

const history = [];
let isLoading = false;

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function formatMessage(text) {
  let html = escapeHtml(text);
  // Bold: **text**
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  // Italic: *text*
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
  // Numbered lists
  html = html.replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>)/gs, '<ul>$1</ul>');
  // Line breaks to paragraphs
  const paragraphs = html.split(/\n{2,}/);
  if (paragraphs.length > 1) {
    html = paragraphs.map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
  } else {
    html = html.replace(/\n/g, '<br>');
  }
  return html;
}

function addMessage(role, text) {
  const row = document.createElement('div');
  row.className = `message-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'bot' ? '🧪' : '👤';

  const bubble = document.createElement('div');
  bubble.className = `bubble ${role}`;
  bubble.innerHTML = formatMessage(text);

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function showTyping() {
  const row = document.createElement('div');
  row.className = 'typing-row';
  row.id = 'typing';

  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  avatar.textContent = '🧪';

  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';

  row.appendChild(avatar);
  row.appendChild(bubble);
  chatEl.appendChild(row);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

async function sendMessage(userText) {
  if (!userText.trim() || isLoading) return;

  isLoading = true;
  sendBtn.disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', userText);
  history.push({ role: 'user', content: userText });

  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: history
      })
    });

    const data = await res.json();
    removeTyping();

    const reply = data.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('\n');

    if (reply) {
      history.push({ role: 'assistant', content: reply });
      addMessage('bot', reply);
    } else {
      addMessage('bot', 'Entschuldigung, da ist etwas schiefgelaufen. Bitte versuche es noch einmal.');
    }
  } catch (err) {
    removeTyping();
    addMessage('bot', 'Es gab einen Verbindungsfehler. Bitte überprüfe deine Internetverbindung und versuche es erneut.');
    console.error(err);
  }

  isLoading = false;
  sendBtn.disabled = false;
  input.focus();
}

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

// Send on Enter (not Shift+Enter)
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(input.value);
  }
});

sendBtn.addEventListener('click', () => sendMessage(input.value));

// Initial greeting
async function startChat() {
  isLoading = true;
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 600,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: 'Starte das Gespräch mit einer freundlichen Begrüßung und bitte mich dann um die beiden Angaben für den Einstieg.' }]
      })
    });

    const data = await res.json();
    removeTyping();

    const reply = data.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('\n');

    if (reply) {
      history.push({ role: 'assistant', content: reply });
      addMessage('bot', reply);
    }
  } catch (err) {
    removeTyping();
    addMessage('bot', 'Hallo! Ich bin dein Chemie-Tutor. Leider konnte ich keine Verbindung herstellen. Bitte lade die Seite neu.');
  }

  isLoading = false;
  sendBtn.disabled = false;
  input.focus();
}

startChat();
</script>

</body>
</html>
